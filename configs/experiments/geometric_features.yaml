name: "geometric-features-v1-draft"
status: "requires_real_data_validation"
seed: 42
feature_columns:
  - vertex_count
  - face_count
  - edge_count
  - component_count
  - boundary_edge_count
  - nonmanifold_edge_count
  - equilateral_ratio
  - sliver_ratio
  - small_angle_ratio
  - area_coefficient_of_variation
model:
  type: "logistic_regression"
  class_weight: "balanced"
  max_iter: 2000
evaluation:
  precision_at_k: 50
