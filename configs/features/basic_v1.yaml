version: "basic-features-v1"

zero_area_epsilon: 1.0e-12
equilateral_threshold: 0.90
sliver_threshold: 0.05
small_angle_threshold_deg: 5.0

include:
  - vertex_count
  - face_count
  - edge_count
  - component_count
  - zero_area_face_count
  - duplicate_face_count
  - boundary_edge_count
  - nonmanifold_edge_count
  - equilateral_ratio
  - sliver_ratio
  - small_angle_ratio
  - area_coefficient_of_variation
