version: "artistic-features-v1"
status: "implemented"

# 判据见 docs/LABELING_GUIDE.md，方向见 docs/FEATURE_DEFINITIONS.md。
# 开关名就是它写进特征表的列名，不需要翻译。
#
# 期望方向里标了"待实测"的几条，是按判据推出来的猜测。合成对照集
# （tests/test_feature_contrast.py）已验证它们各自响应什么性质，但真实数据上的
# 方向仍要与人工标注对一遍才能定下来。

features:
  # 顶点分布整齐：手工网格的度数集中在少数几个值上，扫描网格的度数散得开。
  # 实测提醒：均匀细分球与环面的度数集中度比手工原型更高——这一列量的是规则
  # 程度，而两个极端都可以很规则，不能单独当"手工探测器"。
  vertex_degree_mode_share: true        # 高 = 好
  vertex_degree_entropy: true           # 低 = 好
  # 局部边长整齐。方向待实测：扫描网格的局部边长同样很均匀。
  one_ring_edge_length_cv_median: true
  # 局部边方向张量的各向异性。方向待实测，而且已被合成例子否掉过一次：
  # 入射方向成对对称的顶点（八面体顶点、规则网格顶点）都会趋近 0。
  local_edge_direction_anisotropy_mean: true
  # 共顶点的边更趋共线。方向待实测：规则铺砌的顶点也可能偏共线。
  neighboring_direction_consistency_mean: true
  # 平坦处稀疏、转折处密集。判据里"顶点分布整齐"的直接对应量。
  # 实测边界：看不见折痕（折痕是外赋弯曲、内蕴角缺陷为零）；均匀参数化下有
  # 系统性负偏（均匀环面 −0.98），不是干净探测器。
  curvature_density_correlation: true   # 正 = 好
  # 顶点都不冗余：删掉任何一个都会丢形状。
  # 实测：细分越细读数越低（0.873 → 0.033）；粗而有折痕的盒子与棱柱在 0.6–1.2。
  qem_redundancy_median: true           # 高 = 好
