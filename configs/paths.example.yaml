# Copy this file to paths.remote.yaml on the data device and fill real paths.
# Do not commit the private path file: configs/paths.remote.yaml is ignored.

sources:
  toys4k:
    root: "/path/to/toys4k"
    label: 1
    label_origin: "dataset_proxy"
    selection_rule: "all_available_toys4k_positive_samples"
  objaverse:
    root: "/path/to/selected_objaverse"
    label: 0
    label_origin: "dataset_proxy"
    # The negative set was screened by hand before it reached this project, so
    # the screening rule is part of the label definition, not a detail.
    selection_rule: "user_screened_triangle_meshes_under_20k_faces_and_vertices"
    # Declared bounds of that screening. `smoke` checks the sampled assets
    # against them, so a wrong or unscreened directory fails the gate instead of
    # silently redefining what "negative" means. Counts are measured after
    # triangulation, because that is what the pipeline sees.
    selection_limits:
      max_face_count: 20000
      max_vertex_count: 20000

outputs:
  manifest: "data/manifests/assets_v1.csv"
  features: "data/manifests/basic_features_v1.csv"
  deduplicated_manifest: "data/manifests/assets_deduplicated_v1.csv"
  fingerprints: "data/manifests/fingerprints_v1.csv"
  split_root: "data/splits/v1"
  run_root: "runs"
  # Keep the smoke-test report separate from the full-pass outputs.
  probe_report: "reports/probe_report.json"
  smoke_report: "reports/smoke_report.json"
  matched_test: "data/splits/v1/matched_test.csv"
  # The blind sheet and its answer key must stay in separate files.
  audit_gold: "data/labels/audit_gold.csv"
  audit_gold_key: "data/labels/audit_gold_key.csv"

# Extensions the pipeline will ingest. The probe reports any file outside this
# list, because those files are invisible to every other command.
formats:
  extensions:
    - ".obj"
    - ".ply"
    - ".stl"
    - ".off"
    - ".glb"
    - ".gltf"
    - ".fbx"

runtime:
  hash_files: true
  continue_on_error: true
  # null means "every file". Set a small number for the smoke pass, then null
  # for the full pass, using a different output path for each.
  limit_per_source: null
  # How many files per source `probe` and `smoke` inspect.
  sample_per_source: 20
  # Reuse already-parsed rows from the features file instead of recomputing
  # them. Only safe while the read-only sources are unchanged.
  resume: false
  # How often `validate` rewrites the features table while running. Without it a
  # long run that dies leaves nothing behind, and `resume` has nothing to reuse.
  flush_every: 200

# Duplicate grouping. Exact grouping uses SHA-256 and costs nothing; near
# grouping parses the candidate assets again, so it is the one stage worth
# turning off while iterating. Keep it on for the split that feeds training:
# a duplicate split across two splits leaks a model into the evaluation.
deduplicate:
  near_duplicate: true
  tolerance: 0.001
  max_bucket_size: 200

# Gate thresholds for `smoke`. Pick these from the probe and the first smoke
# run, then keep them fixed so later runs stay comparable.
smoke:
  min_parse_rate: 0.9
  max_seconds_per_asset: 120
  max_peak_mb: 2048

# Write the production ratios explicitly: the frozen split files are only
# reproducible if these values travel with them.
split:
  seed: 42
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

# Face-count-matched test set. Drawn from the frozen pool, never used for
# training. Bin edges are absolute face counts; assets above the last edge land
# in the open-ended top bin and are reported if that bin has only one label.
matched_test:
  pool: ["test"]
  max_per_bin_per_label: 200
  min_pairs_per_bin: 1
  face_count_edges: [0, 250, 500, 1000, 2000, 5000, 10000, 20000, 50000]

# Blind human-review sample. Keep the key away from the reviewer.
audit_gold:
  size: 200
  seed: 7
  min_per_stratum: 5
  stratify_by: "label_and_face_count_bin"
  face_count_edges: [0, 250, 500, 1000, 2000, 5000, 10000, 20000, 50000]
